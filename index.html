<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>WebAR - Stories AR Effect</title>

  <!-- A-Frame 1.4.2 & MindAR 1.2.2 -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Начальный экран для разблокировки воспроизведения iOS/Android */
    #start-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    #start-overlay h2 {
      margin: 0 0 10px 0;
      font-size: 22px;
      font-weight: 700;
    }

    #start-overlay p {
      margin: 0 0 24px 0;
      font-size: 15px;
      color: rgba(255, 255, 255, 0.7);
    }

    #start-btn {
      padding: 16px 36px;
      font-size: 17px;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(135deg, #007aff, #0051a8);
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 122, 255, 0.4);
      transition: transform 0.2s ease;
    }

    #start-btn:active {
      transform: scale(0.96);
    }

    /* Плавающая кнопка квиза внизу */
    #link-btn {
      display: none;
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      text-decoration: none;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 50px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
    }
  </style>
</head>
<body>

  <!-- Стартовый оверлей -->
  <div id="start-overlay">
    <h2>Оживающая фотография</h2>
    <p>Нажмите кнопку и наведите камеру на фото</p>
    <button id="start-btn">Открыть AR</button>
  </div>

  <!-- Ссылка на квиз -->
  <a id="link-btn" href="https://ilyararzuyev.github.io/Monke1year" target="_blank">
    Перейти на квиз 🚀
  </a>

  <!-- 
    Параметры сглаживания:
    - filterMinCF & filterBeta: фильтрация шума и мелких трясок камеры
    - missTolerance: задержка (в кадрах) перед исчезновением при наклонах и уходе из кадра
    - warmupTolerance: быстрая фиксация при первом обнаружении
  -->
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; maxTrack: 1; filterMinCF: 0.0001; filterBeta: 0.001; warmupTolerance: 3; missTolerance: 12;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights; logarithmicDepthBuffer: true; precision: high; antialias: true;" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <video 
        id="ar-video" 
        src="video.mp4" 
        loop 
        crossorigin="anonymous" 
        playsinline 
        webkit-playsinline>
      </video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- AR мишень -->
    <a-entity mindar-image-target="targetIndex: 0" id="target">
      <!-- 
        Примечание:
        - width="1" height="1.5" задано для стандартных фото 10x15 (2:3).
        - Если у вас фото 16:9, укажите width="1" height="0.5625".
        - position="0 0 0.005" приподнимает видео над плоскостью, убирая мерцание под острым углом.
      -->
      <a-video 
        src="#ar-video" 
        width="1" 
        height="1.5" 
        position="0 0 0.005">
      </a-video>
    </a-entity>
  </a-scene>

  <script>
    const startOverlay = document.getElementById('start-overlay');
    const startBtn = document.getElementById('start-btn');
    const linkBtn = document.getElementById('link-btn');
    const video = document.getElementById('ar-video');
    const target = document.getElementById('target');

    // Снятие блокировки Autoplay при нажатии
    startBtn.addEventListener('click', () => {
      video.play().then(() => {
        video.pause();
        startOverlay.style.display = 'none';
        linkBtn.style.display = 'inline-flex';
      }).catch(err => {
        console.log("Ошибка инициализации аудио/видео:", err);
        startOverlay.style.display = 'none';
        linkBtn.style.display = 'inline-flex';
      });
    });

    // Воспроизведение при обнаружении фото
    target.addEventListener("targetFound", () => {
      video.play();
    });

    // Пауза при полной потере фото из вида
    target.addEventListener("targetLost", () => {
      video.pause();
    });
  </script>
</body>
</html>
