<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR.js NFT Video Scan</title>

  <!-- Подключение A-Frame и AR.js NFT -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
    /* Экран загрузки NFT маркер-трекинга */
    .arjs-loader {
      height: 100%;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background-color: rgba(0, 0, 0, 0.8);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-family: sans-serif;
      font-size: 1.2rem;
    }
  </style>

  <script>
    // Скрипт автопроигрывания видео при потере/нахождении маркера
    AFRAME.registerComponent('marker-video-handler', {
      init: function () {
        var marker = this.el;
        var video = document.querySelector('#ar-video');

        // Воспроизведение видео при наведении камеры на изображение
        marker.addEventListener('markerFound', function () {
          if (video) {
            video.play();
          }
        });

        // Пауза при потере маркера из поля зрения
        marker.addEventListener('markerLost', function () {
          if (video) {
            video.pause();
          }
        });
      }
    });
  </script>
</head>

<body style="margin: 0px; overflow: hidden;">
  <!-- Индикатор загрузки генерации дескрипторов NFT -->
  <div class="arjs-loader">
    <div>Загрузка AR-маркера, подождите...</div>
  </div>

  <a-scene
    vr-mode-ui="enabled: false;"
    renderer="logarithmicDepthBuffer: true;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">

    <!-- Ресурсы (видео) -->
    <a-assets>
      <video
        id="ar-video"
        src="video.mp4"
        preload="auto"
        loop
        crossorigin="anonymous"
        webkit-playsinline
        playsinline>
      </video>
    </a-assets>

    <!-- NFT-маркер. Указываем путь БЕЗ расширения (.iset/.fset/.fset3) -->
    <a-nft
      type="nft"
      url="./markers/target"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
      marker-video-handler>

      <!-- Контент поверх маркера (плоскость с видео) -->
      <a-video
        src="#ar-video"
        width="150"
        height="100"
        position="50 0 -100"
        rotation="-90 0 0">
      </a-video>

    </a-nft>

    <!-- Камера сцены -->
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
