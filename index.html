<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>NFT WebAR Video</title>

  <!-- Чистый three.js и nft-ar скрипты -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@master/three.js/build/ar-nft.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    .arjs-loader {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); color: white; display: flex;
      justify-content: center; align-items: center; z-index: 9999;
    }
    #start-btn {
      display: none; position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); z-index: 10000; padding: 16px 32px;
      font-size: 18px; font-weight: bold; color: #fff; background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.4); border-radius: 30px; cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="arjs-loader" id="loader">Загрузка AR-маркера, подождите...</div>
  <button id="start-btn">Нажмите, чтобы начать</button>

  <video id="ar-video" src="video.mp4" loop crossorigin="anonymous" playsinline webkit-playsinline style="display:none;"></video>

  <script>
    // Загрузка NFT маркера без A-Frame ошибок
    window.addEventListener('arjs-nft-loaded', function () {
      document.getElementById('loader').style.display = 'none';
      document.getElementById('start-btn').style.display = 'block';
    });

    const startBtn = document.getElementById('start-btn');
    const video = document.getElementById('ar-video');

    startBtn.addEventListener('click', () => {
      video.play().then(() => {
        video.pause();
        startBtn.style.display = 'none';
      });
    });
  </script>
</body>
</html>
