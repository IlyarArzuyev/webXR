<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR.js NFT Video Scan</title>

  <!-- Подключение A-Frame и AR.js NFT -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    /* Экран загрузки NFT маркер-трекинга */
    .arjs-loader {
      height: 100%;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 1.2rem;
    }

    /* Кнопка активации аудио/видео */
    #start-btn {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10000;
      padding: 16px 32px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 18px;
      font-weight: bold;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
  </style>

  <script>
    // Скрытие загрузчика после полного анализа файлов маркера
    window.addEventListener('arjs-nft-loaded', function () {
      const loader = document.querySelector('.arjs-loader');
      if (loader) {
        loader.style.display = 'none';
      }
      // Показываем кнопку для разблокировки звука
      const startBtn = document.getElementById('start-btn');
      if (startBtn) {
        startBtn.style.display = 'block';
      }
    });

    // Компонент управления видео при сканировании
    AFRAME.registerComponent('marker-video-handler', {
      init: function () {
        var marker = this.el;
        var video = document.querySelector('#ar-video');
        var startBtn = document.getElementById('start-btn');

        // Клик по кнопке разблокирует автоплей с звуком
        startBtn.addEventListener('click', function () {
          video.muted = false;
          video.play().then(() => {
            video.pause();
            startBtn.style.display = 'none';
          }).catch(err => {
            console.log("Ошибка воспроизведения:", err);
            startBtn.style.display = 'none';
          });
        });

        // Воспроизведение при распознавании картинки
        marker.addEventListener('markerFound', function () {
          if (video) {
            video.play().catch(e => console.log(e));
          }
        });

        // Пауза при потере маркера
        marker.addEventListener('markerLost', function () {
          if (video) {
            video.pause();
          }
        });
      }
    });
  </script>
</head>

<body style="margin: 0px; overflow: hidden;">

  <!-- Черный оверлей загрузки -->
  <div class="arjs-loader">
    <div>Загрузка AR-маркера, подождите...</div>
  </div>

  <!-- Кнопка старта -->
  <button id="start-btn">Нажмите, чтобы начать</button>

  <a-scene
    vr-mode-ui="enabled: false;"
    renderer="logarithmicDepthBuffer: true;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">

    <a-assets>
      <video
        id="ar-video"
        src="video.mp4"
        preload="auto"
        loop
        crossorigin="anonymous"
        webkit-playsinline
        playsinline>
      </video>
    </a-assets>

    <!-- Относительный путь к файлам маркера target -->
    <a-nft
      type="nft"
      url="./markers/target"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
      marker-video-handler>

      <a-video
        src="#ar-video"
        width="150"
        height="100"
        position="50 0 -100"
        rotation="-90 0 0">
      </a-video>

    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
