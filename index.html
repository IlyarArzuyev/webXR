<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>World Anchored WebAR</title>

  <!-- A-Frame 1.4.2 & MindAR 1.2.2 -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #start-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    #start-btn {
      padding: 16px 36px;
      font-size: 17px;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(135deg, #007aff, #0051a8);
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 122, 255, 0.4);
    }

    #link-btn {
      display: none;
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      text-decoration: none;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 50px;
    }
  </style>
</head>
<body>

  <div id="start-overlay">
    <h2>Зафиксировать AR в пространстве</h2>
    <p>Наведите камеру на фото для привязки</p>
    <button id="start-btn">Запустить AR</button>
  </div>

  <a id="link-btn" href="https://ilyararzuyev.github.io/Monke1year" target="_blank">
    Перейти на квиз 🚀
  </a>

  <a-scene 
    id="scene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; maxTrack: 1; filterMinCF: 0.0001; filterBeta: 0.001;" 
    color-space="sRGB" 
    renderer="colorManagement: true; logarithmicDepthBuffer: true; precision: high; antialias: true;" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <video 
        id="ar-video" 
        src="video.mp4" 
        loop 
        crossorigin="anonymous" 
        playsinline 
        webkit-playsinline>
      </video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Маркер, к которому привязано видео в момент скана -->
    <a-entity mindar-image-target="targetIndex: 0" id="target">
      <a-video 
        id="video-entity"
        src="#ar-video" 
        width="1" 
        height="1.5" 
        position="0 0 0.005">
      </a-video>
    </a-entity>
  </a-scene>

  <script>
    const startOverlay = document.getElementById('start-overlay');
    const startBtn = document.getElementById('start-btn');
    const linkBtn = document.getElementById('link-btn');
    const video = document.getElementById('ar-video');
    const target = document.getElementById('target');
    const videoEntity = document.getElementById('video-entity');
    const scene = document.getElementById('scene');

    let isAnchored = false;

    startBtn.addEventListener('click', () => {
      video.play().then(() => {
        video.pause();
        startOverlay.style.display = 'none';
        linkBtn.style.display = 'inline-flex';
      }).catch(err => {
        console.log("Ошибка запуска:", err);
        startOverlay.style.display = 'none';
        linkBtn.style.display = 'inline-flex';
      });
    });

    // Как только маркер пойман в первый раз:
    target.addEventListener("targetFound", () => {
      // Запускаем видео
      video.play();

      // Если мы еще не зафиксировали позицию в пространстве:
      if (!isAnchored) {
        // Ждем 100мс, чтобы трекинг успел точно вычислить координаты маркера
        setTimeout(() => {
          const worldPosition = new THREE.Vector3();
          const worldQuaternion = new THREE.Quaternion();
          const worldScale = new THREE.Vector3();

          // Считываем точное мировое положение видео в момент сканирования
          videoEntity.object3D.getWorldPosition(worldPosition);
          videoEntity.object3D.getWorldQuaternion(worldQuaternion);
          videoEntity.object3D.getWorldScale(worldScale);

          // Переносим видео из контейнера маркера прямо в сцену (отвязываем от маркера)
          scene.object3D.add(videoEntity.object3D);

          // Присваиваем фиксированные мировые координаты
          videoEntity.object3D.position.copy(worldPosition);
          videoEntity.object3D.quaternion.copy(worldQuaternion);
          videoEntity.object3D.scale.copy(worldScale);

          isAnchored = true;
        }, 100);
      }
    });
  </script>
</body>
</html>
