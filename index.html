<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Stories AR - Image Locked WebAR</title>

  <!-- A-Frame 1.4.2 & MindAR 1.2.2 -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Оверлей старта (для разрешения аудио/видео в iOS Safari) */
    #start-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    #start-btn {
      padding: 16px 36px;
      font-size: 17px;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(135deg, #007aff, #0051a8);
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 122, 255, 0.4);
    }

    /* Кнопка квиза */
    #link-btn {
      display: none;
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      text-decoration: none;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 50px;
    }
  </style>
</head>
<body>

  <div id="start-overlay">
    <h2>Оживающая фотография</h2>
    <p>Наведите камеру на маркер для просмотра</p>
    <button id="start-btn">Открыть AR</button>
  </div>

  <a id="link-btn" href="https://ilyararzuyev.github.io/Monke1year" target="_blank">
    Перейти на квиз 🚀
  </a>

  <!-- 
    filterMinCF: 0.0001 и filterBeta: 0.001 гасят микро-тряску камеры.
    missTolerance: 5 даёт короткий буфер при резких поворотах, чтобы видео не мерцало.
  -->
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; maxTrack: 1; filterMinCF: 0.0001; filterBeta: 0.001; missTolerance: 5;" 
    color-space="sRGB" 
    renderer="colorManagement: true; logarithmicDepthBuffer: true; precision: high; antialias: true;" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <video 
        id="ar-video" 
        src="video.mp4" 
        loop 
        crossorigin="anonymous" 
        playsinline 
        webkit-playsinline>
      </video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Видео строго внутри таргета -->
    <a-entity mindar-image-target="targetIndex: 0" id="target">
      <!-- 
        width="1" height="1.5" под фото 10x15.
        position="0 0 0.005" предотвращает мерцание поверх фото.
      -->
      <a-video 
        id="video-entity"
        src="#ar-video" 
        width="1" 
        height="1.5" 
        position="0 0 0.005">
      </a-video>
    </a-entity>
  </a-scene>

  <script>
    const startOverlay = document.getElementById('start-overlay');
    const startBtn = document.getElementById('start-btn');
    const linkBtn = document.getElementById('link-btn');
    const video = document.getElementById('ar-video');
    const target = document.getElementById('target');

    // Разблокировка медиа по клику
    startBtn.addEventListener('click', () => {
      video.play().then(() => {
        video.pause();
        startOverlay.style.display = 'none';
        linkBtn.style.display = 'inline-flex';
      }).catch(err => {
        console.log("Ошибка старта:", err);
        startOverlay.style.display = 'none';
        linkBtn.style.display = 'inline-flex';
      });
    });

    // Пошел скан маркера -> запускаем видео
    target.addEventListener("targetFound", () => {
      video.play();
    });

    // Маркер ушел из поля зрения -> ставим на паузу и сбрасываем на начало
    target.addEventListener("targetLost", () => {
      video.pause();
      video.currentTime = 0; // Сброс кадра на старт
    });
  </script>
</body>
</html>
