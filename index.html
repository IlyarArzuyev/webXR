<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>WebAR NFT Video</title>

  <!-- Стабильная версия A-Frame 1.2.0 для NFT -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <!-- AR.js с поддержкой NFT -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Оверлей загрузки NFT маркера */
    .arjs-loader {
      height: 100%;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 1.2rem;
    }

    /* Кнопка первого клика (разблокировка автоплея iOS/Android) */
    #start-btn {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10000;
      padding: 16px 32px;
      font-size: 18px;
      font-weight: bold;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    /* Кнопка перехода на квиз */
    #link-btn {
      display: none;
      position: absolute;
      bottom: 35px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10000;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      text-decoration: none;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 50px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
  </style>

  <script>
    // Автоматическое скрытие загрузчика при успехе
    window.addEventListener('arjs-nft-loaded', function () {
      const loader = document.querySelector('.arjs-loader');
      if (loader) {
        loader.style.display = 'none';
      }
      const startBtn = document.getElementById('start-btn');
      if (startBtn) {
        startBtn.style.display = 'block';
      }
    });

    // Управление воспроизведением видео
    AFRAME.registerComponent('marker-video-handler', {
      init: function () {
        var marker = this.el;
        var video = document.querySelector('#ar-video');
        var startBtn = document.getElementById('start-btn');
        var linkBtn = document.getElementById('link-btn');

        // Разблокировка видео и аудио по тапу
        startBtn.addEventListener('click', function () {
          video.muted = false;
          video.play().then(() => {
            video.pause();
            startBtn.style.display = 'none';
            linkBtn.style.display = 'inline-flex';
          }).catch(err => {
            console.log("Ошибка воспроизведения:", err);
            startBtn.style.display = 'none';
            linkBtn.style.display = 'inline-flex';
          });
        });

        // Старт при наведении на картинку
        marker.addEventListener('markerFound', function () {
          if (video) {
            video.play().catch(e => console.log(e));
          }
        });

        // Пауза при потере из виду
        marker.addEventListener('markerLost', function () {
          if (video) {
            video.pause();
          }
        });
      }
    });
  </script>
</head>

<body style="margin: 0px; overflow: hidden;">

  <!-- Черный оверлей загрузки -->
  <div class="arjs-loader">
    <div>Загрузка AR-маркера, подождите...</div>
  </div>

  <!-- Кнопка старта -->
  <button id="start-btn">Нажмите, чтобы начать</button>

  <!-- Кнопка ссылки на квиз -->
  <a id="link-btn" href="https://ilyararzuyev.github.io/Monke1year" target="_blank">
    <span>Перейти на квиз</span>
  </a>

  <!-- Сцена AR.js строго для NFT -->
  <a-scene
    vr-mode-ui="enabled: false;"
    renderer="logarithmicDepthBuffer: true;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">

    <a-assets>
      <video
        id="ar-video"
        src="video.mp4"
        preload="auto"
        loop
        crossorigin="anonymous"
        webkit-playsinline
        playsinline>
      </video>
    </a-assets>

    <!-- NFT Маркер (ссылается на файлы markers/target) -->
    <a-nft
      type="nft"
      url="./markers/target"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
      marker-video-handler>

      <a-video
        src="#ar-video"
        width="150"
        height="100"
        position="50 0 -100"
        rotation="-90 0 0">
      </a-video>

    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

</body>
</html>
