<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>WebAR NFT Video</title>

  <!-- Чистый A-Frame 1.2.0 -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <!-- Заменяем сырой raw.githack на CDN jsDelivr для AR.js NFT -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@master/aframe/build/aframe-ar-nft.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .arjs-loader {
      height: 100%;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 1.2rem;
    }

    #start-btn {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10000;
      padding: 16px 32px;
      font-size: 18px;
      font-weight: bold;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 30px;
      cursor: pointer;
    }

    #link-btn {
      display: none;
      position: absolute;
      bottom: 35px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10000;
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      text-decoration: none;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 50px;
    }
  </style>

  <script>
    // Скрытие загрузчика
    window.addEventListener('arjs-nft-loaded', function () {
      console.log("NFT Маркер успешно загружен!");
      const loader = document.querySelector('.arjs-loader');
      if (loader) loader.style.display = 'none';
      
      const startBtn = document.getElementById('start-btn');
      if (startBtn) startBtn.style.display = 'block';
    });

    AFRAME.registerComponent('marker-video-handler', {
      init: function () {
        var marker = this.el;
        var video = document.querySelector('#ar-video');
        var startBtn = document.getElementById('start-btn');
        var linkBtn = document.getElementById('link-btn');

        startBtn.addEventListener('click', function () {
          video.muted = false;
          video.play().then(() => {
            video.pause();
            startBtn.style.display = 'none';
            linkBtn.style.display = 'inline-flex';
          }).catch(err => {
            console.log("Ошибка воспроизведения:", err);
            startBtn.style.display = 'none';
            linkBtn.style.display = 'inline-flex';
          });
        });

        marker.addEventListener('markerFound', function () {
          if (video) video.play().catch(e => console.log(e));
        });

        marker.addEventListener('markerLost', function () {
          if (video) video.pause();
        });
      }
    });
  </script>
</head>

<body style="margin: 0px; overflow: hidden;">

  <div class="arjs-loader">
    <div>Загрузка AR-маркера, подождите...</div>
  </div>

  <button id="start-btn">Нажмите, чтобы начать</button>

  <a id="link-btn" href="https://ilyararzuyev.github.io/Monke1year" target="_blank">
    <span>Перейти на квиз</span>
  </a>

  <!-- ВАЖНО: В параметрах arjs убраны лишние флаги, мешающие NFT -->
  <a-scene
    vr-mode-ui="enabled: false;"
    renderer="logarithmicDepthBuffer: true; precision: medium;"
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-assets>
      <video
        id="ar-video"
        src="video.mp4"
        preload="auto"
        loop
        crossorigin="anonymous"
        webkit-playsinline
        playsinline>
      </video>
    </a-assets>

    <a-nft
      type="nft"
      url="./markers/target"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
      marker-video-handler>

      <a-video
        src="#ar-video"
        width="150"
        height="100"
        position="50 0 -100"
        rotation="-90 0 0">
      </a-video>

    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

</body>
</html>
